<title>Sales Ledger</title>
<style>

</style>

<div class="wrap" id="app"></div>
<script src="config.js"></script>

<script>
const getTheme = () => { try{ return localStorage.getItem('rms-theme') || 'light'; }catch(e){ return 'light'; } };
document.documentElement.dataset.theme = getTheme();
let DATA = {};
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SECNAME = {sales:'Sales', expense:'Invoices (to pay)', cash:'Cash purchases (cash-out)', card:'Card purchases (paid)', transfer:'Transfer / Missing', disc:'Cash discrepancy'};
const WSEC = {'RATE FIXED':'Fixed rate (RATE FIXED)', 'TIME FIXED':'Hourly (TIME FIXED)', 'CASH':'Cash (CASH)'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-AU', {style:'currency', currency:'AUD'}).format(n || 0);
const pct = n => isFinite(n) ? (n*100).toFixed(1) + '%' : '–';
let BR = [];

/* dates: stored as ISO, shown as DD/MM/YYYY */
const fd = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
const fs2 = s => s.slice(8,10) + '/' + s.slice(5,7);
function parseDate(txt, ref){
  const m = String(txt).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2}|\d{4}))?$/); if(!m) return null;
  let y = m[3] ? +m[3] : +(ref || '2026').slice(0,4); if(y < 100) y += 2000;
  const d = +m[1], mo = +m[2], dt = new Date(Date.UTC(y, mo - 1, d));
  if(dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return dt.toISOString().slice(0,10);
}
const iso = d => d.toISOString().slice(0,10);
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const monday = s => { const d = new Date(s + 'T00:00:00Z'); return addDays(s, -((d.getUTCDay() + 6) % 7)); };
const weekDays = ws => Array.from({length:7}, (_, i) => addDays(ws, i));

/* ---------- Backend: Google Apps Script web app on the owner's Google Sheet. Every call needs a signed login token. ---------- */
const CFG = window.RMS_CONFIG || {};
const SKEY = 'rms-session-v2';
const AUTH = {tok:null};
let ME = null, S = {entries:[], cats:{}, items:{}, wages:[], hiddenWage:{}, deductions:[]}, PROFILES = [], SNAP = {e:new Map(), c:new Map(), i:new Map()};
let idc = 0; const nid = () => Date.now() * 1000 + (idc++ % 1000);
const lsGet = () => { try{ return localStorage.getItem(SKEY); }catch(e){ return null; } };
const lsSet = v => { try{ v ? localStorage.setItem(SKEY, v) : localStorage.removeItem(SKEY); }catch(e){} };
async function api(a, body = {}){
  let r;
  try{ r = await fetch(CFG.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({a, t:AUTH.tok, ...body}), redirect:'follow'}); }
  catch(e){ throw new Error('Cannot reach the server. Check your internet connection.'); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Unexpected reply from the server.'); }
  if(j.error){
    const er = new Error(j.error === 'AUTH' ? 'Your session expired. Please sign in again.' : j.error); er.auth = j.error === 'AUTH';
    if(er.auth){ AUTH.tok = null; lsSet(null); ME = null; UI.loginErr = er.message; render(); }
    throw er;
  }
  return j;
}
const pack = e => JSON.stringify({id:e.id, br:e.br, date:e.date, sec:e.sec, cat:e.cat, amt:e.amt, ref:e.ref || '', note:e.note || '', file:e.file || ''});
const ckey = c => c.br + '|' + c.sec + '|' + c.label;
const cval = c => c.counted + '|' + (c.grp || '');
function applyLoad(j){
  ME = j.me; PROFILES = j.profiles;
  const order = ['WT', 'LE', 'BO', 'GN', 'TM', 'CT'];
  DATA = {}; j.meta.forEach(m => DATA[m.br] = m.data);
  BR = Object.keys(DATA).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99 || a.localeCompare(b));
  S = {entries:j.entries.map(e => ({id:e.id, br:e.br, date:e.date, sec:e.sec, cat:e.cat, amt:Number(e.amt), ref:e.ref || '', note:e.note || '', file:e.file || ''})), cats:{}, items:{}};
  (j.items || []).forEach(it => S.items[it.entry] = {br:it.br, date:it.date, supplier:it.supplier, lines:it.lines});
  S.staff = j.staff || []; S.pay = j.pay || {payees:[], payers:[]}; S.checks = {}; S.inv = {}; (j.checks || []).forEach(c => { if(c.amt !== null && c.amt !== undefined) S.checks[c.id] = c.amt; S.inv[c.id] = {phys:!!c.phys, digital:c.digital === null || c.digital === undefined ? null : c.digital, acc:!!c.acc, pstat:c.pstat || '', dstat:c.dstat || '', log:c.log || ''}; }); S.digital = j.digital || []; S._dg = null; S.wages = j.wages || []; S.hiddenWage = {}; (j.hiddenWage || []).forEach(h => S.hiddenWage[h.br + '|' + h.week] = h.cost); S.deductions = j.deductions || []; S.costs = j.costs || [];
  BR.forEach(b => S.cats[b] = []);
  j.cats.forEach(c => (S.cats[c.br] = S.cats[c.br] || []).push({sec:c.sec, label:c.label, counted:c.counted, ...(c.sec === 'cash' ? {grp:c.grp || ''} : {})}));
  SNAP = {e:new Map(S.entries.map(e => [e.id, pack(e)])), c:new Map(), i:new Map(Object.entries(S.items).map(([k, v]) => [+k, JSON.stringify(v)]))};
  for(const b of BR) for(const c of S.cats[b]) SNAP.c.set(ckey({br:b, ...c}), cval(c));
  let fixed = false; for(const b of BR) for(const c of S.cats[b]) if(c.sec === 'cash' && !c.grp){ c.grp = classify(c.label); fixed = true; }   // one-time: sort existing cash vendors into categories
  if(fixed) setTimeout(save, 0);
}
const loadAll = async () => applyLoad(await api('load'));
const latestWeek = () => { const d = S.entries.reduce((m, e) => e.date > m ? e.date : m, ''); return d ? monday(d) : UI.week; };
async function afterLogin(){
  await loadAll();
  UI.branch = ME.role === 'admin' ? 'ALL' : ME.br; UI.tab = ME.role === 'admin' ? 'summary' : 'import';
  UI.week = latestWeek();
}
async function signIn(username, pw){
  const j = await api('login', {u:username.trim(), p:pw});
  AUTH.tok = j.token; lsSet(j.token);
  await afterLogin();
}
async function signOut(){
  AUTH.tok = null; lsSet(null); ME = null; S = {entries:[], cats:{}, items:{}, wages:[], hiddenWage:{}, deductions:[], checks:{}, inv:{}}; DATA = {}; BR = []; PROFILES = [];
  UI.pw = false; UI.syncErr = null; UI.loginErr = '';
}
/* save(): sends only what changed since the last successful sync; a single queue keeps edits in order */
let queue = Promise.resolve();
function save(){ UI.syncErr = null; queue = queue.then(doSync).catch(e => { if(!e.auth){ UI.syncErr = e.message || 'Unknown error'; render(); } }); }
async function doSync(){
  if(!ME) return;
  const cur = new Map(S.entries.map(e => [e.id, pack(e)])), curC = new Map();
  for(const b of Object.keys(S.cats)) for(const c of S.cats[b]) curC.set(ckey({br:b, ...c}), {br:b, sec:c.sec, label:c.label, counted:c.counted, grp:c.grp || ''});
  const upC = [...curC].filter(([k, v]) => SNAP.c.get(k) !== cval(v)).map(x => x[1]);
  const up = [...cur].filter(([id, js]) => SNAP.e.get(id) !== js).map(x => JSON.parse(x[1]));
  const del = [...SNAP.e.keys()].filter(id => !cur.has(id));
  const liveIds = new Set(S.entries.map(e => e.id));
  Object.keys(S.items).forEach(k => { if(!liveIds.has(+k)) delete S.items[k]; });
  const items = Object.entries(S.items).filter(([k, v]) => SNAP.i.get(+k) !== JSON.stringify(v)).map(([k, v]) => ({entry:+k, br:v.br, date:v.date, supplier:v.supplier, lines:v.lines}));
  if(!up.length && !upC.length && !del.length && !items.length) return;
  await api('sync', {up, upC, del, items});
  items.forEach(it => SNAP.i.set(it.entry, JSON.stringify(S.items[it.entry])));
  upC.forEach(c => SNAP.c.set(ckey(c), cval(c))); up.forEach(e => SNAP.e.set(e.id, pack(e))); del.forEach(id => SNAP.e.delete(id));
  if(UI.syncErr){ UI.syncErr = null; render(); }
}
const todayLocal = () => new Date().toLocaleDateString('en-CA');
const UI = {ip:{sel:{}, date:''}, imp:{text:'', reports:null}, booting:true, loginErr:'', pw:false, branch:'ALL', tab:'summary', day:todayLocal(), week:'2026-10-05', editId:null, draft:{}, fSec:'expense', confirmDel:null};
const user = () => ({role:ME.role, branch:ME.br, name:ME.name});
const allowed = () => user().role === 'admin' ? BR : [user().branch];
function ensureBranch(){
  if(user().role !== 'admin') UI.branch = allowed()[0];
  else if(UI.branch === 'ALL' && !['summary', 'cashwage', 'stppay', 'staff', 'access'].includes(UI.tab)) UI.tab = 'summary';
  else if(UI.branch !== 'ALL' && (UI.tab === 'cashwage' || UI.tab === 'stppay' || UI.tab === 'staff' || UI.tab === 'access')) UI.tab = 'summary';
  if((UI.tab === 'access' || UI.tab === 'cashwage' || UI.tab === 'stppay' || UI.tab === 'staff' || UI.tab === 'invpay') && user().role !== 'admin') UI.tab = 'summary';
  if(UI.branch === 'ALL' && UI.tab === 'invpay') UI.tab = 'summary';
}

/* calculations */
const catInfo = (b, sec, label) => (S.cats[b].find(c => c.sec === sec && c.label === label) || {counted:true});
const entriesFor = (b, days, secs) => S.entries.filter(e => e.br === b && days.includes(e.date) && (!secs || secs.includes(e.sec)));
const NET_UBER = /(uber|door ?dash).*(net|payout)/i;   // delivery payout lines (Uber / Doordash net): a result, not a sales line
const wageRows = (b, ws) => S.wages.filter(w => w.br === b && w.week === ws);
function wageFor(b, ws, d, imp){
  const rows = wageRows(b, ws), hid = S.hiddenWage[b + '|' + ws] || 0;
  if(rows.length || hid) return {has:true, total:Math.round((rows.reduce((a, w) => a + (w.stp || 0) + cashPay(w), 0) + hid) * 100) / 100};
  return {has:imp, total:imp && d.wageSummary ? d.wageSummary.total : 0};
}
function calc(b, ws){
  const days = weekDays(ws), d = DATA[b], rows = days.map(() => ({sales:0, exp:0, cashSales:0, cashExp:0, transfer:0, disc:0, uberG:0, uberN:0, doorG:0, doorN:0}));
  for(const e of entriesFor(b, days)){
    const r = rows[days.indexOf(e.date)], ok = catInfo(b, e.sec, e.cat).counted;
    if(e.sec === 'sales'){ if(ok) r.sales += e.amt; if(e.cat === 'Cash Sales') r.cashSales += e.amt; if(/^uber$/i.test(e.cat)) r.uberG += e.amt; else if(/^door ?dash$/i.test(e.cat)) r.doorG += e.amt; else if(NET_UBER.test(e.cat)){ if(/uber/i.test(e.cat)) r.uberN += e.amt; else r.doorN += e.amt; } }
    else if(e.sec === 'expense'){ if(ok) r.exp += e.amt; }
    else if(e.sec === 'cash'){ if(ok){ r.exp += e.amt; r.cashExp += e.amt; } }
    else if(e.sec === 'card'){ if(ok) r.exp += e.amt; }
    else if(e.sec === 'transfer'){ r.transfer += e.amt; }
    else if(e.sec === 'disc'){ r.disc += e.amt; }
  }
  rows.forEach(r => r.closing = r.cashSales - r.cashExp - r.transfer + r.disc);
  const feeOf = (g, n) => rows.reduce((a, r) => a + (r[n] > 0 ? Math.max(r[g] - r[n], 0) : 0), 0), uberF = feeOf('uberG', 'uberN'), doorF = feeOf('doorG', 'doorN'), uberFee = uberF + doorF;   // platform discounts + fees = gross − net payout, only for days that have a payout
  const imp = ws === d.dates[0], sum = k => rows.reduce((a, r) => a + r[k], 0);
  const gross = entriesFor(b, days, ['sales']).filter(e => !NET_UBER.test(e.cat)).reduce((a, e) => a + e.amt, 0);   // the Uber net payout is a result, not a sales line
  const t = {sales:sum('sales') + (imp ? d.adjSales : 0), exp:sum('exp') + (imp ? d.adjExp : 0), closing:sum('closing'),
    adjSales:imp ? d.adjSales : 0, adjExp:imp ? d.adjExp : 0, wage:wageFor(b, ws, d, imp).total, hasWage:wageFor(b, ws, d, imp).has};
  t.hasExp = !!(imp ? true : entriesFor(b, days, ['expense', 'cash', 'card']).length); t.gross = gross; t.ep = t.sales ? t.exp / t.sales : NaN; t.wp = t.sales ? t.wage / t.sales : NaN; t.uberFee = Math.round(uberFee * 100) / 100; t.feeLbl = uberF > 0 && doorF > 0 ? 'Delivery fees' : doorF > 0 ? 'Doordash fees' : uberF > 0 ? 'Uber fees' : ''; t.fp = t.sales ? t.uberFee / t.sales : NaN; t.net = t.sales - t.uberFee - t.exp - t.wage; t.np = t.sales ? t.net / t.sales : NaN;
  return {rows, days, t};
}

/* rendering */
function render(){
  if(UI.booting){ $('#app').innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(!ME){ $('#app').innerHTML = viewLogin(); const f = $(UI.loginUser ? '#l-pw' : '#l-user'); if(f) f.focus(); return; }
  if(ME.must_change || UI.pw){ $('#app').innerHTML = viewPw(); return; }
  ensureBranch();
  const u = user();
  const chips = u.role === 'admin' ? ['ALL', ...BR].map(b =>
    `<button class="chip" data-act="branch" data-v="${b}" aria-pressed="${UI.branch === b}">${b === 'ALL' ? 'All branches' : b}</button>`).join('') : '';
  const tabs = (u.role === 'admin' && UI.branch === 'ALL' ? [['summary','Summary'], ['access','Access']] : [['import','Import report'], ['summary','Summary'], ['sheet','Weekly sheet'], ...(u.role === 'admin' ? [['invpay','Invoice payment']] : []), ['wage','Wages']])
    .map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${UI.tab === k}">${l}</button>`).join('');
  $('#app').innerHTML = `
    <header class="top">
      <div class="brand"><h1>Sales Ledger</h1><span>${UI.branch === 'ALL' ? 'All branches' : esc(DATA[UI.branch].name)}</span></div>
      <div class="acct"><span class="role">${u.role === 'admin' ? 'ADMIN · ALL BRANCHES' : 'MANAGER · ' + esc(u.branch)}</span> <b>${esc(u.name)}</b>
        <button class="btn sm" data-act="theme">${getTheme() === 'dark' ? 'Light mode' : 'Dark mode'}</button><button class="btn sm" data-act="reload">Reload data</button><button class="btn sm" data-act="pw">Change password</button><button class="btn sm" data-act="logout">Sign out</button></div>
    </header>
    ${UI.syncErr ? `<div class="syncerr" role="alert"><span><b>Changes are not saved yet:</b> ${esc(UI.syncErr)}</span><button class="btn sm" data-act="retry">Retry</button></div>` : ''}
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    ${u.role === 'admin' && UI.branch === 'ALL' ? `<div class="adminrow"><button class="cwbtn" data-act="tab" data-v="cashwage" aria-pressed="${UI.tab === 'cashwage'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Cash Wage<span class="cwsub">Admin only</span></button><button class="cwbtn" data-act="tab" data-v="stppay" aria-pressed="${UI.tab === 'stppay'}">STP wages for payment<span class="cwsub">Admin only</span></button><button class="cwbtn" data-act="tab" data-v="staff" aria-pressed="${UI.tab === 'staff'}">Staff details<span class="cwsub">Admin only</span></button></div>` : ''}
    <div class="tabs" role="tablist">${tabs}</div>
    ${UI.modal ? modalHtml() : ''}
    ${UI.tab === 'daily' ? viewDaily() : UI.tab === 'import' ? viewImport() : UI.tab === 'summary' ? viewSummary() : UI.tab === 'sheet' ? sheetBlank(viewSheet()) : UI.tab === 'invpay' ? viewInvPay() : UI.tab === 'wage' ? viewWage() : UI.tab === 'cashwage' ? viewCashWage() : UI.tab === 'stppay' ? viewStpPay() : UI.tab === 'staff' ? viewStaff() : viewAccess()}`;
  const tw = document.createTreeWalker($('#app'), NodeFilter.SHOW_TEXT), negs = [];
  while(tw.nextNode()){ const n = tw.currentNode, p = n.parentElement; if(p && !/^(SCRIPT|STYLE|TEXTAREA|OPTION|BUTTON|TITLE)$/.test(p.tagName) && /^\s*[-−–]\s*\$?\d[\d,]*(\.\d+)?\s*%?\s*$/.test(n.nodeValue)) negs.push(p); }
  negs.forEach(p => p.classList.add('neg'));
  if(UI.focusReason && $('#m-reason')){ $('#m-reason').focus(); UI.focusReason = false; }
  if(UI.focusAmt && $('#f-amt')){ $('#f-amt').focus(); UI.focusAmt = false; }
}
function viewLogin(){
  const bad = !CFG.url;
  return `<form class="login card" id="login" autocomplete="on"><div class="pad"><h1>Sales Ledger</h1><p>Sign in to continue.</p>
    <label>User ID<input id="l-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required value="${esc(UI.loginUser || '')}"></label>
    <label>Password<input id="l-pw" name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" role="alert">${bad ? 'The server address is not set yet (config.js).' : esc(UI.loginErr)}</div>
    <button class="btn primary" type="submit" ${bad ? 'disabled' : ''}>${UI.busy ? 'Signing in…' : 'Sign in'}</button></div></form>`;
}
function viewPw(){
  const forced = ME.must_change;
  return `<form class="login card" id="pwform" autocomplete="off"><div class="pad"><h1>${forced ? 'Choose a new password' : 'Change password'}</h1>
    <p>${forced ? 'This account still uses a temporary password. Set your own to continue.' : 'Use at least 8 characters.'}</p>
    <label>New password<input id="p-new" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Repeat new password<input id="p-new2" type="password" autocomplete="new-password" minlength="8" required></label>
    <div class="err" role="alert">${esc(UI.pwErr || '')}</div>
    <button class="btn primary" type="submit">${UI.busy ? 'Saving…' : 'Save password'}</button>
    ${forced ? '<p style="margin-top:12px"><button class="btn sm" type="button" data-act="logout">Sign out</button></p>' : '<p style="margin-top:12px"><button class="btn sm" type="button" data-act="pwcancel">Cancel</button></p>'}</div></form>`;
}
function weekBar(){
  return `<div class="bar"><div class="week"><button class="btn" data-act="wk" data-v="-7" aria-label="Previous week">‹</button>
    <b>${fd(UI.week)} – ${fd(addDays(UI.week, 6))}</b>
    <button class="btn" data-act="wk" data-v="7" aria-label="Next week">›</button>
    <button class="btn" data-act="wk" data-v="0">Week 28/09</button><button class="btn" data-act="wk" data-v="latest">Latest week</button></div></div>`;
}
function kpis(t, cash){
  const nw = t.hasWage;
  return `<div class="kpis">
    <div class="kpi"><small>Total sales</small><strong>${money(t.sales)}</strong>${t.adjSales ? `<br><em>incl. Excel delivery adj. ${money(t.adjSales)}</em>` : ''}</div>
    <div class="kpi"><small>Gross sales</small><strong>${money(t.gross)}</strong><br><em>all lines, delivery before fees</em></div>
    <div class="kpi"><small>Net profit</small><strong class="${t.net < 0 ? 'neg' : ''}">${nw && t.hasExp ? money(t.net) : '–'}</strong><br><em>${nw && t.hasExp ? pct(t.np) + ' of sales' + (t.uberFee ? ' · after ' + (t.feeLbl || 'delivery fees') + ' ' + money(t.uberFee) : '') : 'needs expenses and wages'}</em></div>
    <div class="kpi"><small>Expenses</small><strong>${t.hasExp ? money(t.exp) : '–'}</strong><br><em>${t.hasExp ? pct(t.ep) + ' of sales' : 'No expense data for this week'}</em></div>
    <div class="kpi"><small>Wages</small><strong>${nw ? money(t.wage) : '–'}</strong><br><em>${nw ? pct(t.wp) + ' of sales' : 'No wage data for this week'}</em></div>
    ${cash ? `<div class="kpi"><small>Closing cash</small><strong>${money(t.closing)}</strong></div>` : ''}</div>`;
}
function branchCard(b, t){
  const nw = t.hasWage;
  return `<button class="bcard" data-act="branch" data-v="${b}" aria-label="Open ${esc(DATA[b].name)}">
    <div class="hd"><b>${b}</b><span>${esc(DATA[b].name.replace(/\s*\(.*\)/, ''))}</span></div>
    <div class="big"><small>Total sales this week</small>${money(t.sales)}</div>
    <div class="pierow">${miniPie(t)}<dl>
      <dt>Gross sales</dt><dd>${money(t.gross)}</dd><dd class="p"></dd>
      <dt><i class="dot" style="background:var(--c-net)"></i>Net profit</dt><dd class="${t.net < 0 ? 'neg' : ''}">${nw && t.hasExp ? money(t.net) : '–'}</dd><dd class="p">${nw && t.hasExp ? pct(t.np) : ''}</dd>
      <dt><i class="dot" style="background:var(--c-exp)"></i>Expenses</dt><dd>${t.hasExp ? money(t.exp) : '–'}</dd><dd class="p">${t.hasExp ? pct(t.ep) : ''}</dd>
      <dt><i class="dot" style="background:var(--c-wage)"></i>Wages</dt><dd>${nw ? money(t.wage) : '–'}</dd><dd class="p">${nw ? pct(t.wp) : ''}</dd>
      ${t.uberFee ? `<dt><i class="dot" style="background:var(--c-fee)"></i>${t.feeLbl || 'Delivery fees'}</dt><dd>${money(t.uberFee)}</dd><dd class="p">${pct(t.fp)}</dd>` : ''}
    </dl></div><span class="go">Open branch ›</span></button>`;
}
function miniPie(t){
  if(!t.hasExp || !(t.sales > 0)) return '';

function shrinkImage(file){
  return new Promise((res, rej) => {
    if(file.type === 'application/pdf'){
      if(file.size > 6.5e6) return rej(new Error('This PDF is too large (over 6 MB). Please use a photo instead.'));
      const fr = new FileReader(); fr.onload = () => res({mime:'application/pdf', data:String(fr.result).split(',')[1]}); fr.onerror = () => rej(new Error('Could not read the file.')); fr.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1800 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res({mime:'image/jpeg', data:cv.toDataURL('image/jpeg', 0.85).split(',')[1]});
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not open this image. Use a JPG, PNG or PDF.')); };
    im.src = url;
  });
}
function matchSupplier(b, name){

}

    const b = UI.branch; if(!allowed().includes(b)) return;
    const day = UI.day; let added = 0, upd = 0, del = 0;
    document.querySelectorAll('#daily .dinp[data-line]').forEach(i => {
      const v = Math.round((parseFloat(i.value) || 0) * 100) / 100, id = i.dataset.id ? +i.dataset.id : null;
      if(id){ const e = S.entries.find(x => x.id === id); if(!e) return; if(v > 0){ if(e.amt !== v){ e.amt = v; upd++; } } else { S.entries = S.entries.filter(x => x.id !== id); del++; } }
      else if(v > 0){ S.entries.push({id:nid(), br:b, date:day, sec:'sales', cat:i.dataset.line, amt:v, ref:'', note:''}); added++; }
    });
    const nn = $('#n-name').value.trim(), na = Math.round((parseFloat($('#n-amt').value) || 0) * 100) / 100;
    if(nn && na > 0){ if(!S.cats[b].some(c => c.sec === 'sales' && c.label === nn)) S.cats[b].push({sec:'sales', label:nn, counted:true}); S.entries.push({id:nid(), br:b, date:day, sec:'sales', cat:nn, amt:na, ref:'', note:''}); added++; }
    if(!added && !upd && !del){ flash('Nothing to save. Enter at least one amount.'); return; }
    save(); flash(`Sales for ${fd(day)} saved · ${money(dayTotal(b, day))}`); render(); return;
  }
  if(ev.target.id === 'entry'){
    const b = UI.branch; if(!allowed().includes(b)) return;
    const amt = parseFloat($('#f-amt').value), cat = $('#f-cat').value.trim(), date = parseDate($('#f-date').value, UI.week);
    if(!date){ flash('Enter the date as DD/MM/YYYY'); return; }
    const secPre = UI.editId ? (S.entries.find(e => e.id === UI.editId) || {}).sec : ($('#f-sec') ? $('#f-sec').value : 'expense');
    if(!isFinite(amt) || (secPre !== 'disc' && amt < 0) || !cat) return;
    if(secPre === 'disc' && !$('#f-note').value.trim()){ flash('A reason is required for a cash discrepancy'); return; }
    const editing = UI.editId ? S.entries.find(e => e.id === UI.editId) : null;
    const sec = editing ? editing.sec : ($('#f-sec') ? $('#f-sec').value : 'expense');
    const gsel = $('#f-grp') ? $('#f-grp').value : null, ec = S.cats[b].find(c => c.sec === sec && c.label === cat);
    if(!ec) S.cats[b].push({sec, label:cat, counted:true, ...(sec === 'cash' ? {grp:gsel || classify(cat)} : {})});
    else if(sec === 'cash' && gsel && ec.grp !== gsel) ec.grp = gsel;
    if(UI.inv && UI.inv.busy){ flash('Wait until the invoice has been read'); return; }
    const rec = {date, sec, cat, amt:Math.round(amt*100)/100, ref:$('#f-ref').value.trim(), note:$('#f-note').value.trim()};
    if(UI.inv && UI.inv.file) rec.file = UI.inv.file.id;
    let eid;
    if(editing){ Object.assign(editing, rec); eid = editing.id; } else { eid = nid(); S.entries.push({id:eid, br:b, ...rec}); }
    if(UI.inv && UI.inv.items.length) S.items[eid] = {br:b, date, supplier:cat, lines:UI.inv.items.filter(i => String(i.item ?? i.name ?? '').trim()).map(i => ({item:String(i.item ?? i.name).trim(), qty:i.qty === '' || i.qty === undefined ? null : i.qty, amt:r2(i.amt), cat:i.cat}))};
    UI.inv = null;
    save();
    UI.week = monday(date); UI.editId = null; UI.draft = {date:fd(date), cat}; UI.focusAmt = true; UI.confirmDel = null;
    flash(editing ? 'Entry saved' : `${cat} ${money(rec.amt)} added`);
    render();
  }
});
async function boot(){
  render();
  try{ const t = lsGet(); if(t && CFG.url){ AUTH.tok = t; await afterLogin(); } }
  catch(e){ ME = null; if(!e.auth){ AUTH.tok = null; } }
  UI.booting = false; render();
}
boot();
</script>
