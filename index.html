<style>
/* Layout: ledger-style operations console. Top bar (demo account) > branch chips > tabs > working area. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#eceee9; --line:#d7dad3; --fg:#1d2420; --muted:#667068;
  --accent:#1f5f5b; --accent-fg:#ffffff; --accent-soft:#dcebe8;
  --good:#1f7a4d; --warn:#9a6a00; --bad:#b3372b; --bad-soft:#f7e3e0; --warn-soft:#f6ecd2;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --surface2:#222a26; --line:#34403a; --fg:#e6ebe7; --muted:#9aa69f;
  --accent:#6cc2ba; --accent-fg:#0b1412; --accent-soft:#1f3a37;
  --good:#5cc78e; --warn:#e0b44d; --bad:#f08a7e; --bad-soft:#3a2220; --warn-soft:#38300f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --surface2:#222a26; --line:#34403a; --fg:#e6ebe7; --muted:#9aa69f;
  --accent:#6cc2ba; --accent-fg:#0b1412; --accent-soft:#1f3a37;
  --good:#5cc78e; --warn:#e0b44d; --bad:#f08a7e; --bad-soft:#3a2220; --warn-soft:#38300f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{background:var(--warn-soft);color:var(--fg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:6px 16px;font-size:12.5px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:16px 12px}
.brand{display:flex;flex-direction:column}

select,input[type=text],input[type=number],input[type=date],input[type=email]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.role{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;letter-spacing:.03em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}

.card>h2{font-size:14px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

.pierow{display:flex;gap:10px;align-items:center}.pierow dl{flex:1;min-width:0}.pierow dt{white-space:nowrap}.mpie{width:72px;height:72px;flex:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select{width:100%;color:var(--fg)}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}

.day{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-weight:700}
.day span:last-child{font-family:var(--mono)}
.ent{table-layout:fixed;min-width:640px}.ent td:nth-child(1){width:32%}.ent td:nth-child(2){width:15%}.ent td:nth-child(4){width:14%}.ent td:nth-child(5){width:15%}.ent td{overflow:hidden;text-overflow:ellipsis}
.cell small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--sans);max-width:90px;margin-left:auto;overflow:hidden;text-overflow:ellipsis}
td.sub{color:var(--muted);vertical-align:top}
td.cell.editing{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
td.dim{color:var(--line)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:16px}
.bcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;width:100%}
.bcard:hover{border-color:var(--accent);background:var(--surface2)}
.bcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bcard .hd b{font-size:16px}.bcard .hd span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .big{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.bcard .big small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--muted)}
.bcard dl{display:grid;grid-template-columns:1fr auto auto;gap:5px 12px;margin:0;font-size:13px;align-items:baseline}
.bcard dt{color:var(--muted)}.bcard dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.bcard dd.p{color:var(--muted);min-width:52px}
.bcard .go{font-size:12px;color:var(--accent);font-weight:700}
.daynav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.daynav input{width:130px;font-family:var(--mono);font-size:15px;text-align:center}
.daynav .dow{font-weight:700;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--accent-soft);color:var(--good)}.pill.no{background:var(--warn-soft);color:var(--warn)}
.dline{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:10px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.dline .dl{padding-top:9px;font-size:15px}
.dins{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dinp{font-family:var(--mono);font-size:18px;padding:9px 10px;width:150px;max-width:100%;text-align:right}
.dnew{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:10px;padding:12px 14px;align-items:center;background:var(--surface2)}
.dnew .row{display:flex;flex-wrap:wrap;gap:8px}
.dfoot{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--accent);border-radius:0 0 8px 8px}
.dfoot strong{font-family:var(--mono);font-size:22px}
.dfoot small{display:block;color:var(--muted);font-size:12px}
.btn.big{padding:11px 26px;font-size:16px}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--accent-soft)}tr.cur td{background:var(--accent-soft);font-weight:700}
@media (max-width:560px){.dline,.dnew{grid-template-columns:1fr}.dline .dl{padding-top:0}.dinp{width:calc(50% - 4px);flex:1 1 130px}}
.imp textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.imp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chk{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.chk div{display:flex;gap:8px;align-items:baseline;font-size:13px}
.chk .ok{color:var(--good)}.chk .wn{color:var(--warn)}.chk .bd{color:var(--bad)}
.rtable input,.rtable select{width:100%;min-width:90px}
.rtable td.skipped{color:var(--muted)}
.fileb{position:relative;overflow:hidden}.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:6px;margin:12px 14px;font-weight:500}
.mback{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;max-height:calc(100% - 16px);overflow:auto;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h2{margin:0 0 6px;font-size:17px;color:var(--bad)}
.modal p{margin:0 0 12px;color:var(--muted)}
.modal table{margin-bottom:14px}
.modal textarea{width:100%;min-height:84px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;resize:vertical}
.modal label{display:block;font-weight:700;margin-bottom:4px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.editing{outline:2px solid var(--accent);outline-offset:-2px}
.flash{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:9}
.login{max-width:360px;margin:12vh auto 0}
.login h1{margin:0 0 4px;font-size:22px}
.login p{margin:0 0 16px;color:var(--muted)}
.login label{display:block;font-weight:700;margin:0 0 12px}
.login input{display:block;width:100%;margin-top:4px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.login .err{background:none;padding:0;margin:0 0 8px;min-height:20px}
.login .btn{width:100%;padding:10px}
.syncerr{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:8px 12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.top{padding-top:12px}}
</style>

<div class="wrap" id="app"></div>
<script src="config.js"></script>

<script>
let DATA = {};
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SECNAME = {sales:'Sales', expense:'Invoices (to pay)', cash:'Cash purchases (cash-out)', card:'Card purchases (paid)', transfer:'Transfer / Missing', disc:'Cash discrepancy'};
const WSEC = {'RATE FIXED':'Fixed rate (RATE FIXED)', 'TIME FIXED':'Hourly (TIME FIXED)', 'CASH':'Cash (CASH)'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-AU', {style:'currency', currency:'AUD'}).format(n || 0);
const pct = n => isFinite(n) ? (n*100).toFixed(1) + '%' : '–';
let BR = [];

/* dates: stored as ISO, shown as DD/MM/YYYY */
const fd = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
const fs2 = s => s.slice(8,10) + '/' + s.slice(5,7);
function parseDate(txt, ref){
  const m = String(txt).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2}|\d{4}))?$/); if(!m) return null;
  let y = m[3] ? +m[3] : +(ref || '2026').slice(0,4); if(y < 100) y += 2000;
  const d = +m[1], mo = +m[2], dt = new Date(Date.UTC(y, mo - 1, d));
  if(dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return dt.toISOString().slice(0,10);
}
const iso = d => d.toISOString().slice(0,10);
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const monday = s => { const d = new Date(s + 'T00:00:00Z'); return addDays(s, -((d.getUTCDay() + 6) % 7)); };
const weekDays = ws => Array.from({length:7}, (_, i) => addDays(ws, i));

/* ---------- Backend: Google Apps Script web app on the owner's Google Sheet. Every call needs a signed login token. ---------- */
const CFG = window.RMS_CONFIG || {};
const SKEY = 'rms-session-v2';
const AUTH = {tok:null};
let ME = null, S = {entries:[], cats:{}}, PROFILES = [], SNAP = {e:new Map(), c:new Map()};
let idc = 0; const nid = () => Date.now() * 1000 + (idc++ % 1000);
const lsGet = () => { try{ return localStorage.getItem(SKEY); }catch(e){ return null; } };
const lsSet = v => { try{ v ? localStorage.setItem(SKEY, v) : localStorage.removeItem(SKEY); }catch(e){} };
async function api(a, body = {}){
  let r;
  try{ r = await fetch(CFG.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({a, t:AUTH.tok, ...body}), redirect:'follow'}); }
  catch(e){ throw new Error('Cannot reach the server. Check your internet connection.'); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Unexpected reply from the server.'); }
  if(j.error){
    const er = new Error(j.error === 'AUTH' ? 'Your session expired. Please sign in again.' : j.error); er.auth = j.error === 'AUTH';
    if(er.auth){ AUTH.tok = null; lsSet(null); ME = null; UI.loginErr = er.message; render(); }
    throw er;
  }
  return j;
}
const pack = e => JSON.stringify({id:e.id, br:e.br, date:e.date, sec:e.sec, cat:e.cat, amt:e.amt, ref:e.ref || '', note:e.note || ''});
const ckey = c => c.br + '|' + c.sec + '|' + c.label;
function applyLoad(j){
  ME = j.me; PROFILES = j.profiles;
  const order = ['WT', 'LE', 'BO', 'GN', 'TM', 'CT'];
  DATA = {}; j.meta.forEach(m => DATA[m.br] = m.data);
  BR = Object.keys(DATA).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99 || a.localeCompare(b));
  S = {entries:j.entries.map(e => ({id:e.id, br:e.br, date:e.date, sec:e.sec, cat:e.cat, amt:Number(e.amt), ref:e.ref || '', note:e.note || ''})), cats:{}};
  BR.forEach(b => S.cats[b] = []);
  j.cats.forEach(c => (S.cats[c.br] = S.cats[c.br] || []).push({sec:c.sec, label:c.label, counted:c.counted}));
  SNAP = {e:new Map(S.entries.map(e => [e.id, pack(e)])), c:new Map()};
  for(const b of BR) for(const c of S.cats[b]) SNAP.c.set(ckey({br:b, ...c}), c.counted);
}
const loadAll = async () => applyLoad(await api('load'));
async function afterLogin(){
  await loadAll();
  UI.branch = ME.role === 'admin' ? 'ALL' : ME.br; UI.tab = ME.role === 'admin' ? 'summary' : 'daily';
  UI.week = BR.length && DATA[BR[0]].dates ? addDays(DATA[BR[0]].dates[0], 7) : UI.week;
}
async function signIn(username, pw){
  const j = await api('login', {u:username.trim(), p:pw});
  AUTH.tok = j.token; lsSet(j.token);
  await afterLogin();
}
async function signOut(){
  AUTH.tok = null; lsSet(null); ME = null; S = {entries:[], cats:{}}; DATA = {}; BR = []; PROFILES = [];
  UI.pw = false; UI.syncErr = null; UI.loginErr = '';
}
/* save(): sends only what changed since the last successful sync; a single queue keeps edits in order */
let queue = Promise.resolve();
function save(){ UI.syncErr = null; queue = queue.then(doSync).catch(e => { if(!e.auth){ UI.syncErr = e.message || 'Unknown error'; render(); } }); }
async function doSync(){
  if(!ME) return;
  const cur = new Map(S.entries.map(e => [e.id, pack(e)])), curC = new Map();
  for(const b of Object.keys(S.cats)) for(const c of S.cats[b]) curC.set(ckey({br:b, ...c}), {br:b, sec:c.sec, label:c.label, counted:c.counted});
  const upC = [...curC].filter(([k, v]) => SNAP.c.get(k) !== v.counted).map(x => x[1]);
  const up = [...cur].filter(([id, js]) => SNAP.e.get(id) !== js).map(x => JSON.parse(x[1]));
  const del = [...SNAP.e.keys()].filter(id => !cur.has(id));
  if(!up.length && !upC.length && !del.length) return;
  await api('sync', {up, upC, del});
  upC.forEach(c => SNAP.c.set(ckey(c), c.counted)); up.forEach(e => SNAP.e.set(e.id, pack(e))); del.forEach(id => SNAP.e.delete(id));
  if(UI.syncErr){ UI.syncErr = null; render(); }
}
const todayLocal = () => new Date().toLocaleDateString('en-CA');
const UI = {imp:{text:'', reports:null}, booting:true, loginErr:'', pw:false, branch:'ALL', tab:'summary', day:todayLocal(), week:'2026-10-05', editId:null, draft:{}, fSec:'expense', confirmDel:null};
const user = () => ({role:ME.role, branch:ME.br, name:ME.name});
const allowed = () => user().role === 'admin' ? BR : [user().branch];
function ensureBranch(){
  if(user().role !== 'admin') UI.branch = allowed()[0];
  else if(UI.branch === 'ALL' && UI.tab !== 'summary') UI.branch = BR[0];
  if(UI.tab === 'access' && user().role !== 'admin') UI.tab = 'summary';
}

/* calculations */
const catInfo = (b, sec, label) => (S.cats[b].find(c => c.sec === sec && c.label === label) || {counted:true});
const entriesFor = (b, days, secs) => S.entries.filter(e => e.br === b && days.includes(e.date) && (!secs || secs.includes(e.sec)));
function calc(b, ws){
  const days = weekDays(ws), d = DATA[b], rows = days.map(() => ({sales:0, exp:0, cashSales:0, cashExp:0, transfer:0, disc:0}));
  for(const e of entriesFor(b, days)){
    const r = rows[days.indexOf(e.date)], ok = catInfo(b, e.sec, e.cat).counted;
    if(e.sec === 'sales'){ if(ok) r.sales += e.amt; if(e.cat === 'Cash Sales') r.cashSales += e.amt; }
    else if(e.sec === 'expense'){ if(ok) r.exp += e.amt; }
    else if(e.sec === 'cash'){ if(ok){ r.exp += e.amt; r.cashExp += e.amt; } }
    else if(e.sec === 'card'){ if(ok) r.exp += e.amt; }
    else if(e.sec === 'transfer'){ r.transfer += e.amt; }
    else if(e.sec === 'disc'){ r.disc += e.amt; }
  }
  rows.forEach(r => r.closing = r.cashSales - r.cashExp - r.transfer + r.disc);
  const imp = ws === d.dates[0], sum = k => rows.reduce((a, r) => a + r[k], 0);
  const gross = entriesFor(b, days, ['sales']).reduce((a, e) => a + e.amt, 0);
  const t = {sales:sum('sales') + (imp ? d.adjSales : 0), exp:sum('exp') + (imp ? d.adjExp : 0), closing:sum('closing'),
    adjSales:imp ? d.adjSales : 0, adjExp:imp ? d.adjExp : 0, wage:imp && d.wageSummary ? d.wageSummary.total : 0, hasWage:imp};
  t.hasExp = !!(imp ? true : entriesFor(b, days, ['expense', 'cash', 'card']).length); t.gross = gross; t.ep = t.sales ? t.exp / t.sales : NaN; t.wp = t.sales ? t.wage / t.sales : NaN; t.net = t.sales - t.exp - t.wage; t.np = t.sales ? t.net / t.sales : NaN;
  return {rows, days, t};
}

function miniPie(t){
  if(!t.hasExp || !(t.sales > 0)) return '';
  const full = t.hasWage, net = t.sales - t.exp - t.wage;
  let sl;
  if(full && net >= 0) sl = [['Net profit', net, 'var(--good)'], ['Expenses', t.exp, 'var(--warn)'], ['Wages', t.wage, 'var(--accent)']];
  else if(full) sl = [['Expenses', t.exp, 'var(--warn)'], ['Wages', t.wage, 'var(--accent)']];
  else sl = [['Left after expenses', Math.max(t.sales - t.exp, 0), 'var(--good)'], ['Expenses', t.exp, 'var(--warn)']];
  const tot = sl.reduce((a, s) => a + s[1], 0); if(!(tot > 0)) return '';
  let a0 = -Math.PI / 2, paths = '';
  const R = 46, r = 28, C = 50, pt = (rad, a) => [(C + rad * Math.cos(a)).toFixed(2), (C + rad * Math.sin(a)).toFixed(2)];
  for(const [n, v, col] of sl){
    const f = v / tot; if(f <= 0) continue;
    const a1 = a0 + Math.min(f, 0.99999) * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
    paths += `<path d="M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z" fill="${col}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(n)}: ${money(v)} (${pct(v / t.sales)} of sales)</title></path>`;
    a0 = a1;
  }
  return `<svg class="mpie" viewBox="0 0 100 100" role="img" aria-label="Pie chart of sales split into ${sl.map(s => s[0]).join(', ')}">${paths}</svg>`;
}

const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function detectBranch(line){
  const n = norm(line.replace(/\*/g, ''));
  if(n.length < 5 || /[:：]/.test(line)) return null;
  for(const b of BR){
    const full = norm(DATA[b].name.replace(/\s*\(.*\)/, ''));
    if(n.includes(full) || (n.length >= 8 && full.includes(n)) || n.includes(norm('(' + b + ')')) && /\(\w{2}\)/.test(line)) return b;
  }

function mapSalesCat(b, label){
  const cats = S.cats[b].filter(c => c.sec === 'sales'), n = norm(label);
  const find = f => (cats.find(c => f(norm(c.label))) || {}).label || null;
  let r = find(x => x === n);
  if(r) return r;
  if(/^card/.test(n)) return find(x => x.startsWith('card'));
  if(/^cash/.test(n)) return find(x => x.startsWith('cash'));
  if(/uber/.test(n)) return find(x => x.includes('uber'));
  if(/online|prepaid|deposit/.test(n)) return find(x => x.includes('online') || x.includes('deposit'));
  if(/missing/.test(n)) return find(x => x.includes('missing'));
  if(/door/.test(n)) return find(x => x.includes('door'));
  if(/toogood/.test(n)) return find(x => x.includes('toogood'));
  if(/goodtogo|gootogo/.test(n)) return find(x => x.includes('goodtogo'));
  if(/school/.test(n)) return find(x => x.includes('school'));
  if(/voucher/.test(n)) return find(x => x.includes('voucher'));

function parseReports(text){
  const lines = text.split(/\r?\n/).map(l => l.trim());
  const heads = []; lines.forEach((l, i) => { const b = detectBranch(l); if(b) heads.push([i, b]); });
  const blocks = heads.length ? heads.map(([i, b], k) => ({branch:b, lines:lines.slice(i + 1, k + 1 < heads.length ? heads[k + 1][0] : lines.length)})) : [{branch:null, lines}];
  return blocks.map(bl => {
    const r = {branch:bl.branch, date:null, dateRaw:'', staff:'', totalRep:null, closingRep:null, cashOut:null, ignored:[], raw:[], fields:[], addBack:false, blocked:''};
    for(const line of bl.lines){
      if(!line) continue;
      if(line.startsWith('(')){ line.replace(/^\(|\)$/g, '').split(',').forEach(p => { const m = p.match(/^\s*(.*?)\s*[:：]\s*(.*?)\s*$/); if(m) r.ignored.push(m[2] ? `${m[1]}: ${m[2]}` : `${m[1]} (empty)`); }); continue; }
      const m = line.match(/^(.*?)\s*[:：]\s*(.*)$/); if(!m) continue;
      const label = m[1].replace(/\*/g, '').trim(), val = m[2].trim(), n = norm(label), amt = numOf(val);
      if(n === 'date'){ r.dateRaw = val; r.date = parseDate(val, '2026'); }
      else if(/staff/.test(n)){ r.staff = val; }
      else if(n === 'salestotal' || n === 'total'){ r.totalRep = amt; }
      else if(/^closing/.test(n)){ r.closingRep = amt; }
      else if(/cashout/.test(n)){ r.cashOut = amt; }
      else if(/^\d+(am|pm)/.test(n)){ r.ignored.push(`${label}${amt === null ? ' (empty)' : ': ' + money(amt)}`); }
      else if(amt === null){ r.ignored.push(`${label} (empty)`); }
      else r.raw.push({label, amount:amt});
    }
    if(!r.branch) r.branch = user().role === 'admin' ? (UI.branch === 'ALL' ? BR[0] : UI.branch) : user().branch;
    mapReport(r); return r;
  });
}
function mapReport(r){
  const b = r.branch, cashCats = S.cats[b].filter(c => c.sec === 'cash');
  r.blocked = allowed().includes(b) ? '' : `This report is for ${b}, but you can only add data for ${allowed().join(', ')}.`;
  r.fields = r.raw.map(f => { const c = mapSalesCat(b, f.label); return {label:f.label, amount:f.amount, kind:c ? 'sales' : 'unmapped', target:c ? 'sales|' + c : 'skip'}; });
  if(r.cashOut !== null){
    r.fields.push({label:'Cash-out total', amount:r.cashOut, kind:'cash', target:'cash|', vendor:''});
  }
  r.addBack = false;
}
function analyze(r){
  const b = r.branch, inc = r.fields.filter(f => f.target !== 'skip' && f.amount > 0);
  const sf = inc.filter(f => f.target.startsWith('sales|') || f.target.startsWith('new|')), cf = inc.filter(f => f.target.startsWith('cash|'));
  const cashLine = sf.find(f => f.target === 'sales|Cash Sales'), co = cf.reduce((a, f) => a + f.amount, 0);
  const counted = f => { const l = f.target.split('|')[1]; return catInfo(b, 'sales', l).counted; };
  const rawSum = sf.filter(counted).reduce((a, f) => a + f.amount, 0);
  const diff = r.totalRep !== null ? r.totalRep - rawSum : null;
  const suggest = !!(cashLine && co > 0 && diff !== null && Math.abs(diff - co) < 0.005 && r.closingRep !== null && Math.abs(r.closingRep - cashLine.amount) < 0.005);
  const cashRec = cashLine ? cashLine.amount + (r.addBack ? co : 0) : 0;
  const sumRec = rawSum + (cashLine && r.addBack ? co : 0);
  const closingCalc = cashRec - co;
  const checks = [];
  if(r.totalRep !== null){
    if(Math.abs(r.totalRep - sumRec) < 0.005) checks.push(['ok', `Sales total matches the recorded lines (${money(sumRec)}).`]);
    else checks.push(['wn', `The report's Sales total is ${money(r.totalRep)}, but the recorded lines add up to ${money(sumRec)} (difference ${money(r.totalRep - sumRec)}).`]);
  } else checks.push(['wn', 'No Sales total in the report, so lines could not be cross-checked.']);
  if(r.closingRep !== null && cashLine){
    if(Math.abs(r.closingRep - closingCalc) < 0.005) checks.push(['ok', `Closing cash matches (${money(closingCalc)}).`]);
    else checks.push(['bd', `Closing cash does not match: cash sales − cash-out is ${money(closingCalc)}, but the report's closing amount is ${money(r.closingRep)}. You will be asked how to continue when you save.`]);
  }
  if(r.fields.some(f => f.kind === 'unmapped' && f.target === 'skip')) checks.push(['wn', 'Some lines are not matched to a sales line and will be skipped. Choose where they belong if you want them recorded.']);

  return {suggest, cashRec, co, checks, hasCash:!!cashLine};
}

  else if(a === 'addinp'){
    const w = [...document.querySelectorAll('.dins')].find(x => x.dataset.wrap === t.dataset.line), last = w.querySelector('.dinp');
    const n = last.cloneNode(); n.value = ''; n.dataset.id = ''; w.insertBefore(n, t); n.focus(); return;
  }
  else if(a === 'impparse'){ UI.imp.text = ($('#imp-text') || {}).value || UI.imp.text; UI.imp.reports = parseReports(UI.imp.text); }
  else if(a === 'impexample'){ UI.imp.text = EXAMPLE; UI.imp.reports = parseReports(EXAMPLE); }
  else if(a === 'impclear'){ UI.imp = {text:'', reports:null}; }
  else if(a === 'impsave'){ const ri = +t.dataset.r, m = closingMismatch(UI.imp.reports[ri]); if(m){ UI.modal = {ri, ...m, reason:''}; UI.focusReason = true; } else impSave(ri); }
  else if(a === 'modalresubmit'){ UI.modal = null; }
  else if(a === 'modalrecord'){ const m = UI.modal; if(!m || !m.reason.trim()) return; UI.modal = null; impSave(m.ri, {amt:m.D, reason:m.reason.trim()}); }
  else if(a === 'impdiscard'){ UI.imp.reports.splice(+t.dataset.r, 1); if(!UI.imp.reports.length) UI.imp.reports = null; }
  else if(a === 'wk'){ const v = +t.dataset.v; UI.week = t.dataset.v === 'latest' ? '2026-10-05' : v === 0 ? DATA[BR[0]].dates[0] : addDays(UI.week, v); UI.editId = null; UI.draft = {}; }
  else if(a === 'add'){ UI.editId = null; UI.fSec = t.dataset.sec; UI.draft = {date:fd(t.dataset.d), cat:t.dataset.c}; UI.focusAmt = true; }
  else if(a === 'edit'){ UI.editId = +t.dataset.id; UI.draft = {}; UI.confirmDel = null; UI.focusAmt = true; }
  else if(a === 'cancel'){ UI.editId = null; UI.draft = {}; }
  else if(a === 'del'){ const id = +t.dataset.id; if(UI.confirmDel === id){ S.entries = S.entries.filter(e => e.id !== id); UI.confirmDel = null; UI.editId = null; UI.draft = {}; save(); flash('Entry deleted'); } else { UI.confirmDel = id; } }
  else if(a === 'logout'){ signOut().then(render); return; }
  else if(a === 'pw'){ UI.pw = true; UI.pwErr = ''; }
  else if(a === 'pwcancel'){ UI.pw = false; }
  else if(a === 'retry'){ save(); }
  else if(a === 'reload'){ loadAll().then(() => { flash('Data reloaded'); render(); }).catch(e => flash('Reload failed: ' + e.message)); return; }
  else return;
  render();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(false){}
  else if(t.dataset.act === 'fsec'){ readDraft(); UI.fSec = t.value; render(); }
  else if(t.id === 'imp-file'){
    const f = t.files && t.files[0]; if(!f) return;
    const rd = new FileReader(); rd.onload = () => { UI.imp.text = String(rd.result || ''); UI.imp.reports = parseReports(UI.imp.text); render(); }; rd.readAsText(f); return;
  }
  else if(t.dataset.imp){ impChange(t); }
  else if(t.id === 'd-date'){ const d = parseDate(t.value, UI.day); if(d){ UI.day = d; render(); } else { flash('Enter the date as DD/MM/YYYY'); t.value = fd(UI.day); } }
  else if(t.id === 'f-cat' || t.id === 'f-date'){ readDraft(); const h = $('#hint'); if(h) h.innerHTML = hintHtml(); }
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && UI.modal){ UI.modal = null; render(); } });
document.addEventListener('input', ev => { if(ev.target.id === 'imp-text') UI.imp.text = ev.target.value;
  if(ev.target.id === 'm-reason' && UI.modal){ UI.modal.reason = ev.target.value; const bt = $('#m-rec'); if(bt) bt.disabled = !ev.target.value.trim(); } if(ev.target.classList && ev.target.classList.contains('dinp')) updDayTotal(); });
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if(ev.target.id === 'login'){
    UI.loginUser = $('#l-user').value; const pw = $('#l-pw').value; UI.busy = true; UI.loginErr = ''; render();
    signIn(UI.loginUser, pw).catch(e => { UI.loginErr = e.message; ME = null; })
      .finally(() => { UI.busy = false; render(); });
    return;
  }
  if(ev.target.id === 'pwform'){
    const p1 = $('#p-new').value, p2 = $('#p-new2').value;
    if(p1.length < 8){ UI.pwErr = 'Use at least 8 characters.'; render(); return; }
    if(p1 !== p2){ UI.pwErr = 'The two passwords do not match.'; render(); return; }
    if(p1 === '1234'){ UI.pwErr = 'Choose a different password.'; render(); return; }
    UI.busy = true; UI.pwErr = ''; render();
    api('chpw', {np:p1})
      .then(j => { AUTH.tok = j.token; lsSet(j.token); ME = j.me; UI.pw = false; flash('Password changed'); })
      .catch(e => { UI.pwErr = e.message; })
      .finally(() => { UI.busy = false; render(); });
    return;
  }
  if(ev.target.id === 'daily'){
    const b = UI.branch; if(!allowed().includes(b)) return;
    const day = UI.day; let added = 0, upd = 0, del = 0;
    document.querySelectorAll('#daily .dinp[data-line]').forEach(i => {
      const v = Math.round((parseFloat(i.value) || 0) * 100) / 100, id = i.dataset.id ? +i.dataset.id : null;
      if(id){ const e = S.entries.find(x => x.id === id); if(!e) return; if(v > 0){ if(e.amt !== v){ e.amt = v; upd++; } } else { S.entries = S.entries.filter(x => x.id !== id); del++; } }
      else if(v > 0){ S.entries.push({id:nid(), br:b, date:day, sec:'sales', cat:i.dataset.line, amt:v, ref:'', note:''}); added++; }
    });
    const nn = $('#n-name').value.trim(), na = Math.round((parseFloat($('#n-amt').value) || 0) * 100) / 100;
    if(nn && na > 0){ if(!S.cats[b].some(c => c.sec === 'sales' && c.label === nn)) S.cats[b].push({sec:'sales', label:nn, counted:true}); S.entries.push({id:nid(), br:b, date:day, sec:'sales', cat:nn, amt:na, ref:'', note:''}); added++; }
    if(!added && !upd && !del){ flash('Nothing to save. Enter at least one amount.'); return; }
    save(); flash(`Sales for ${fd(day)} saved · ${money(dayTotal(b, day))}`); render(); return;
  }
  if(ev.target.id === 'entry'){
    const b = UI.branch; if(!allowed().includes(b)) return;
    const amt = parseFloat($('#f-amt').value), cat = $('#f-cat').value.trim(), date = parseDate($('#f-date').value, UI.week);
    if(!date){ flash('Enter the date as DD/MM/YYYY'); return; }
    const secPre = UI.editId ? (S.entries.find(e => e.id === UI.editId) || {}).sec : (UI.tab === 'sales' ? 'sales' : ($('#f-sec') ? $('#f-sec').value : 'expense'));
    if(!isFinite(amt) || (secPre !== 'disc' && amt < 0) || !cat) return;
    if(secPre === 'disc' && !$('#f-note').value.trim()){ flash('A reason is required for a cash discrepancy'); return; }
    const editing = UI.editId ? S.entries.find(e => e.id === UI.editId) : null;
    const sec = editing ? editing.sec : (UI.tab === 'sales' ? 'sales' : ($('#f-sec') ? $('#f-sec').value : 'expense'));
    if(!S.cats[b].some(c => c.sec === sec && c.label === cat)) S.cats[b].push({sec, label:cat, counted:true});
    const rec = {date, sec, cat, amt:Math.round(amt*100)/100, ref:$('#f-ref').value.trim(), note:$('#f-note').value.trim()};
    if(editing) Object.assign(editing, rec); else S.entries.push({id:nid(), br:b, ...rec});
    save();
    UI.week = monday(date); UI.editId = null; UI.draft = {date:fd(date), cat}; UI.focusAmt = true; UI.confirmDel = null;
    flash(editing ? 'Entry saved' : `${cat} ${money(rec.amt)} added`);
    render();
  }
});
async function boot(){
  render();
  try{ const t = lsGet(); if(t && CFG.url){ AUTH.tok = t; await afterLogin(); } }
  catch(e){ ME = null; if(!e.auth){ AUTH.tok = null; } }
  UI.booting = false; render();
}
boot();
</script>
